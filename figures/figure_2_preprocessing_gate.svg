<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">TUDOK as a Preliminary Truth-Fidelity and Reality-Alignment Gate</title>
<desc id="desc">Companion diagram showing input components, a preliminary TUDOK gate, AI processing, verification and routing, and output.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#143d7a"/></marker>
<style>.h{font:700 29px Arial;fill:#10366f}.s{font:18px Arial;fill:#17345f}.b{fill:#f8fbff;stroke:#3565a8;stroke-width:2}.c{fill:#edf4ff;stroke:#143d7a;stroke-width:3}.l{stroke:#143d7a;stroke-width:3;marker-end:url(#a)}</style></defs>
<text x="600" y="48" text-anchor="middle" class="h">Figure 2. TUDOK as a Preliminary Truth-Fidelity and Reality-Alignment Gate</text>
<rect x="35" y="120" width="205" height="170" rx="14" class="b"/><text x="138" y="155" text-anchor="middle" class="s" font-weight="700">Input components</text><text x="138" y="192" text-anchor="middle" class="s">data sources</text><text x="138" y="222" text-anchor="middle" class="s">preprocessing</text><text x="138" y="252" text-anchor="middle" class="s">basic validation</text>
<line x1="240" y1="205" x2="285" y2="205" class="l"/>
<rect x="295" y="90" width="300" height="230" rx="14" class="c"/><text x="445" y="130" text-anchor="middle" class="s" font-weight="700">Preliminary TUDOK gate</text><text x="445" y="168" text-anchor="middle" class="s">truth-fidelity / reality-alignment</text><text x="445" y="198" text-anchor="middle" class="s">source and context awareness</text><text x="445" y="228" text-anchor="middle" class="s">coherence pre-screening</text><text x="445" y="258" text-anchor="middle" class="s">uncertainty / distortion signals</text><text x="445" y="288" text-anchor="middle" class="s">review need</text>
<line x1="595" y1="205" x2="640" y2="205" class="l"/>
<rect x="650" y="110" width="210" height="190" rx="14" class="b"/><text x="755" y="148" text-anchor="middle" class="s" font-weight="700">AI core</text><text x="755" y="186" text-anchor="middle" class="s">representation</text><text x="755" y="216" text-anchor="middle" class="s">context / memory</text><text x="755" y="246" text-anchor="middle" class="s">generation</text>
<line x1="860" y1="205" x2="905" y2="205" class="l"/>
<rect x="915" y="105" width="240" height="200" rx="14" class="b"/><text x="1035" y="145" text-anchor="middle" class="s" font-weight="700">Verification &amp; routing</text><text x="1035" y="184" text-anchor="middle" class="s">flags and uncertainty</text><text x="1035" y="214" text-anchor="middle" class="s">accept / revise</text><text x="1035" y="244" text-anchor="middle" class="s">external check</text><text x="1035" y="274" text-anchor="middle" class="s">human review</text>
<rect x="150" y="405" width="900" height="120" rx="16" class="b"/><text x="600" y="445" text-anchor="middle" class="s" font-weight="700">Feedback</text><text x="600" y="482" text-anchor="middle" class="s">data quality · source feedback · coherence/risk/error feedback · review outcomes</text>
<rect x="105" y="585" width="990" height="75" rx="14" class="c"/><text x="600" y="615" text-anchor="middle" class="s">TUDOK is not a post hoc truth judgment or a binary permission filter.</text><text x="600" y="645" text-anchor="middle" class="s">It is a preliminary calibration and review-routing gate.</text>
</svg>