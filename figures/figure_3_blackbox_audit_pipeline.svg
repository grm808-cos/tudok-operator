<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">TUDOK Audit Workflow in a Closed-Model Environment</title>
<desc id="desc">Six-stage closed-model audit workflow: audit goal and input, output capture, TUDOK evaluation, diagnostics, indices and time series, governance output, plus an improvement cycle and human responsibility boundary.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#123d7b"/></marker>
<style>.h{font:700 34px Arial;fill:#10366f}.sh{font:700 18px Arial;fill:white}.t{font:17px Arial;fill:#17345f}.b{fill:#fbfdff;stroke:#4472b5;stroke-width:2}.head{fill:#123d7b}.c{fill:#edf4ff;stroke:#123d7b;stroke-width:2}.l{stroke:#123d7b;stroke-width:3;marker-end:url(#a)}</style></defs>
<text x="800" y="48" text-anchor="middle" class="h">Figure 3. TUDOK Audit Workflow in a Closed-Model Environment</text>
<text x="800" y="82" text-anchor="middle" class="t">Output-level audit without access to model internals</text>
<rect x="1290" y="20" width="265" height="75" rx="12" class="c"/><text x="1422" y="50" text-anchor="middle" class="t" font-weight="700">CLOSED MODEL</text><text x="1422" y="76" text-anchor="middle" class="t">no access to model internals</text>

<!-- six columns -->
<g transform="translate(25,130)"><rect width="235" height="520" rx="12" class="b"/><rect width="235" height="48" rx="12" class="head"/><text x="118" y="31" text-anchor="middle" class="sh">1. AUDIT GOAL &amp; INPUT</text>
<text x="18" y="88" class="t" font-weight="700">Audit goal</text><text x="18" y="120" class="t">• model evaluation</text><text x="18" y="150" class="t">• provider comparison</text><text x="18" y="180" class="t">• prompting strategy</text><text x="18" y="210" class="t">• compliance support</text>
<text x="18" y="270" class="t" font-weight="700">Inputs</text><text x="18" y="302" class="t">• test tasks</text><text x="18" y="332" class="t">• frozen outputs</text><text x="18" y="362" class="t">• audit logs</text><text x="18" y="392" class="t">• reference sources</text></g>

<g transform="translate(285,130)"><rect width="235" height="520" rx="12" class="b"/><rect width="235" height="48" rx="12" class="head"/><text x="118" y="31" text-anchor="middle" class="sh">2. OUTPUT CAPTURE</text>
<text x="18" y="88" class="t" font-weight="700">Task &amp; response ID</text><text x="18" y="120" class="t">• task prompt ID</text><text x="18" y="150" class="t">• output ID</text><text x="18" y="180" class="t">• model / version</text><text x="18" y="210" class="t">• risk category</text>
<text x="18" y="270" class="t" font-weight="700">Segmentation</text><text x="18" y="302" class="t">• statements</text><text x="18" y="332" class="t">• sentence / claim</text><text x="18" y="362" class="t">• reasoning step</text><text x="18" y="392" class="t">• auditable units</text></g>

<g transform="translate(545,130)"><rect width="235" height="520" rx="12" class="b"/><rect width="235" height="48" rx="12" class="head"/><text x="118" y="31" text-anchor="middle" class="sh">3. TUDOK EVALUATION</text>
<text x="18" y="90" class="t">C - Coherence</text><text x="18" y="128" class="t">K - Consistency</text><text x="18" y="166" class="t">I - Truth/reality alignment</text><text x="18" y="204" class="t">D - Distortion pressure</text>
<rect x="18" y="250" width="199" height="62" rx="8" class="c"/><text x="118" y="288" text-anchor="middle" class="t">sᵢ = C + K + I - D</text>
<rect x="18" y="340" width="199" height="92" rx="8" class="c"/><text x="118" y="374" text-anchor="middle" class="t">TUDOK(x) =</text><text x="118" y="404" text-anchor="middle" class="t">max(0, MeanRawScore) / 3</text></g>

<g transform="translate(805,130)"><rect width="235" height="520" rx="12" class="b"/><rect width="235" height="48" rx="12" class="head"/><text x="118" y="31" text-anchor="middle" class="sh">4. DIAGNOSTICS</text>
<text x="18" y="88" class="t" font-weight="700">Diagnostic signals</text><text x="18" y="120" class="t">• weak source coverage</text><text x="18" y="150" class="t">• unsupported certainty</text><text x="18" y="180" class="t">• missing uncertainty</text><text x="18" y="210" class="t">• normative risk</text>
<text x="18" y="270" class="t" font-weight="700">Recommended step</text><text x="18" y="302" class="t">• accept</text><text x="18" y="332" class="t">• revise</text><text x="18" y="362" class="t">• external verification</text><text x="18" y="392" class="t">• human review</text>
<text x="18" y="450" class="t" font-weight="700">Uncertainty note</text><text x="18" y="482" class="t">measurement limits</text></g>

<g transform="translate(1065,130)"><rect width="235" height="520" rx="12" class="b"/><rect width="235" height="48" rx="12" class="head"/><text x="118" y="31" text-anchor="middle" class="sh">5. INDICES &amp; TIME SERIES</text>
<text x="18" y="88" class="t" font-weight="700">Sub-indices</text><text x="18" y="120" class="t">• C-index</text><text x="18" y="150" class="t">• K-index</text><text x="18" y="180" class="t">• I-index</text><text x="18" y="210" class="t">• D-index</text>
<text x="18" y="275" class="t" font-weight="700">Composite index</text><text x="18" y="310" class="t">TUDOK_0_1 / TUDOK %</text>
<text x="18" y="380" class="t" font-weight="700">Time-series monitoring</text><text x="18" y="415" class="t">trends · drift</text><text x="18" y="445" class="t">model updates</text><text x="18" y="475" class="t">improvement cycles</text></g>

<g transform="translate(1325,130)"><rect width="235" height="520" rx="12" class="b"/><rect width="235" height="48" rx="12" class="head"/><text x="118" y="31" text-anchor="middle" class="sh">6. GOVERNANCE OUTPUT</text>
<text x="18" y="88" class="t" font-weight="700">Audit report</text><text x="18" y="120" class="t">• summary</text><text x="18" y="150" class="t">• deviations</text><text x="18" y="180" class="t">• risks</text><text x="18" y="210" class="t">• recommendations</text>
<text x="18" y="270" class="t" font-weight="700">Organisational decisions</text><text x="18" y="302" class="t">• review trigger</text><text x="18" y="332" class="t">• policy update</text><text x="18" y="362" class="t">• prompt improvement</text><text x="18" y="392" class="t">• supplier comparison</text>
<text x="18" y="450" class="t" font-weight="700">Human responsibility</text><text x="18" y="482" class="t">expert review in</text><text x="18" y="510" class="t">high-risk cases</text></g>

<line x1="260" y1="390" x2="280" y2="390" class="l"/><line x1="520" y1="390" x2="540" y2="390" class="l"/><line x1="780" y1="390" x2="800" y2="390" class="l"/><line x1="1040" y1="390" x2="1060" y2="390" class="l"/><line x1="1300" y1="390" x2="1320" y2="390" class="l"/>

<rect x="180" y="705" width="1240" height="100" rx="16" class="b"/><text x="800" y="742" text-anchor="middle" class="t" font-weight="700">IMPROVEMENT CYCLE</text><text x="800" y="780" text-anchor="middle" class="t">prompt refinement · source strengthening · threshold tuning · re-measurement</text>
<rect x="120" y="845" width="1360" height="95" rx="16" class="c"/><text x="800" y="880" text-anchor="middle" class="t" font-weight="700">The TUDOK index is not an objective truth certificate.</text><text x="800" y="910" text-anchor="middle" class="t">It is a calibration audit signal indicating truth-fidelity, reality-alignment, and distortion risk. It does not replace domain-specific or human responsibility.</text>
</svg>