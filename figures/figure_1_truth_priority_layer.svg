<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">TUDOK as a Truth-Fidelity and Reality-Alignment Calibration Layer</title>
<desc id="desc">Companion diagram showing AI processing, generated output, TUDOK evaluation, review routing, and human or institutional use.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#143d7a"/></marker>
<style>.h{font:700 30px Arial;fill:#10366f}.s{font:18px Arial;fill:#17345f}.b{fill:#f8fbff;stroke:#3565a8;stroke-width:2}.c{fill:#edf4ff;stroke:#143d7a;stroke-width:3}.l{stroke:#143d7a;stroke-width:3;marker-end:url(#a)}</style></defs>
<text x="600" y="48" text-anchor="middle" class="h">Figure 1. TUDOK as a Truth-Fidelity and Reality-Alignment Calibration Layer</text>
<rect x="55" y="115" width="220" height="160" rx="14" class="b"/><text x="165" y="150" text-anchor="middle" class="s" font-weight="700">Data / context / task</text><text x="165" y="185" text-anchor="middle" class="s">sources</text><text x="165" y="215" text-anchor="middle" class="s">preprocessing</text><text x="165" y="245" text-anchor="middle" class="s">basic validation</text>
<line x1="275" y1="195" x2="335" y2="195" class="l"/>
<rect x="345" y="105" width="250" height="180" rx="14" class="b"/><text x="470" y="145" text-anchor="middle" class="s" font-weight="700">AI processing</text><text x="470" y="180" text-anchor="middle" class="s">representation</text><text x="470" y="210" text-anchor="middle" class="s">context / memory</text><text x="470" y="240" text-anchor="middle" class="s">generation</text>
<line x1="595" y1="195" x2="655" y2="195" class="l"/>
<rect x="665" y="85" width="300" height="220" rx="14" class="c"/><text x="815" y="125" text-anchor="middle" class="s" font-weight="700">TUDOK evaluation layer</text><text x="815" y="160" text-anchor="middle" class="s">C - coherence</text><text x="815" y="190" text-anchor="middle" class="s">K - consistency</text><text x="815" y="220" text-anchor="middle" class="s">I - truth/reality alignment</text><text x="815" y="250" text-anchor="middle" class="s">D - distortion pressure</text><text x="815" y="280" text-anchor="middle" class="s">diagnostic flags</text>
<line x1="965" y1="195" x2="1025" y2="195" class="l"/>
<rect x="1035" y="105" width="120" height="180" rx="14" class="b"/><text x="1095" y="145" text-anchor="middle" class="s" font-weight="700">Routing</text><text x="1095" y="180" text-anchor="middle" class="s">accept</text><text x="1095" y="210" text-anchor="middle" class="s">revise</text><text x="1095" y="240" text-anchor="middle" class="s">verify</text><text x="1095" y="270" text-anchor="middle" class="s">human review</text>
<rect x="165" y="390" width="870" height="155" rx="16" class="b"/><text x="600" y="430" text-anchor="middle" class="s" font-weight="700">Feedback and continuous learning</text><text x="600" y="470" text-anchor="middle" class="s">prompt refinement · source strengthening · evaluator calibration · human oversight</text><text x="600" y="510" text-anchor="middle" class="s">The evaluator layer does not generate the answer; it evaluates the already generated output.</text>
<rect x="110" y="595" width="980" height="70" rx="14" class="c"/><text x="600" y="638" text-anchor="middle" class="s">Architectural interpretation only - not a claim about the physical structure of every AI system.</text>
</svg>